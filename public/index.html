<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PRIVE_SEPTEMBER CAMPAIGN BLS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,640&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="masthead">
    <div class="page-wide">
      <div class="brand-mark">
        <img src="/publicis-media.png" alt="Publicis Media" />
      </div>
      <div class="masthead-copy">
        <p class="eyebrow">PRIVE_SEPTEMBER CAMPAIGN BLS</p>
        <h1>Who we reached</h1>
        <p class="lede">Age and gender for every survey, control (1) beside experimental (2).</p>
      </div>
      <div class="top-meta">
        <p id="generated">Loading…</p>
        <button id="reload" type="button">Refresh from Kobo</button>
      </div>
    </div>
  </header>

  <div class="page">
    <section>
      <div class="section-head">
        <div>
          <p class="section-kicker">Surveys A–F</p>
          <h2>Control and experimental cells</h2>
        </div>
        <p>Counts and share of each arm. Same layout for every survey.</p>
      </div>
      <div id="surveys"></div>
    </section>
  </div>
  <script src="/dashboard.js"></script>
</body>
</html>
